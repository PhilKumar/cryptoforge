# ═══════════════════════════════════════════════════════════════
#  CryptoForge — Manual Deploy / Retry (Zero Downtime, Blue-Green)
# ═══════════════════════════════════════════════════════════════
#
#  MANUAL ONLY. The automatic deploy lives in playwright.yml, gated on the
#  E2E suite passing. This workflow is the fallback you trigger by hand.
#
#  It used to run on every push to main as well, which was wrong twice over:
#
#   1. It deployed IMMEDIATELY, without waiting for E2E — so a push whose
#      tests were about to fail still reached the live trading engine. The
#      gate in playwright.yml was decorative.
#   2. Both workflows deploying meant TWO blue-green cycles per push. Each
#      cycle runs the old and new engine together for ~30-60s and hands over
#      the .cascade-writer.lock, then reconciles live orders — which can
#      cancel and re-place a resting TP. On 2026-07-28 the second cycle did
#      exactly that, replacing a TP that had just been placed correctly.
#
#  Kept (rather than deleted) because the redundancy genuinely helped once:
#  on 2026-07-28 this workflow hit a transient Azure -> ap-south-1 SSH
#  timeout while the E2E-gated deploy, on a different runner, succeeded. As
#  a manual trigger it is still that fallback — re-run it when the automatic
#  deploy fails for reasons unrelated to the code, or to ship an emergency
#  fix without waiting for E2E.
#
name: Deploy CryptoForge

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-cryptoforge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      - name: Run zero-downtime deploy
        run: |
          ssh deploy-target "cd ~/cryptoforge && git fetch origin main && git reset --hard origin/main && bash deploy/cd-deploy.sh"

      - name: Verify deployment
        run: |
          sleep 3
          ssh deploy-target "cd ~/cryptoforge && test \"\$(git rev-parse HEAD)\" = \"${GITHUB_SHA}\" && curl -sf http://127.0.0.1:\$(cat ~/.cryptoforge-active-port)/api/health >/dev/null && echo 'Deployment commit and health verified'"

      - name: Post-deploy summary
        if: always()
        run: |
          ssh deploy-target "echo '── CryptoForge Deploy Status ──' && echo 'State:' \$(systemctl is-active cryptoforge@\$(cat ~/.cryptoforge-active-port)) && echo 'Active port:' \$(cat ~/.cryptoforge-active-port)"

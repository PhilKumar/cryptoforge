name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-scan:
    name: Lint, Security Scan, Import Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs the whole pushed range, so it needs the parent of the
          # first commit in that range. The default shallow clone only has the
          # tip, and git then fails with "unknown revision" — which the action
          # reports as an error even though it found no leaks.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          # Pinned: an unpinned ruff drifts away from the pre-commit hook
          # and fails checks that pass locally. Bump both together.
          # pyarrow is a TEST dependency: options/store.py writes parquet, but the
          # app never imports that package, so it stays out of requirements.txt.
          pip install ruff==0.15.5 bandit pip-audit pytest pyarrow

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Bandit security scan
        run: |
          bandit -r . \
            --exclude .venv,venv,tests \
            --severity-level medium \
            --confidence-level medium \
            -c pyproject.toml

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Import check (smoke test)
        env:
          DELTA_API_KEY: "dummy"
          DELTA_API_SECRET: "dummy"
          BINANCE_API_KEY: ""
          BINANCE_API_SECRET: ""
          COINDCX_API_KEY: ""
          COINDCX_API_SECRET: ""
          CRYPTOFORGE_PIN: "test-pin-not-real"
          CRYPTOFORGE_TOTP_SECRET: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          DISCORD_WEBHOOK_URL: ""
          CRYPTOFORGE_STATE_DIR: "/tmp/cryptoforge-ci-state"
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('DELTA_API_KEY', 'dummy')
          os.environ.setdefault('DELTA_API_SECRET', 'dummy')
          from engine.indicators import ema, rsi, macd, bollinger_bands, supertrend, adx
          from engine.backtest import run_backtest
          print('All imports OK')
          "

      - name: Run unit tests
        env:
          DELTA_API_KEY: "dummy"
          DELTA_API_SECRET: "dummy"
          BINANCE_API_KEY: ""
          BINANCE_API_SECRET: ""
          COINDCX_API_KEY: ""
          COINDCX_API_SECRET: ""
          CRYPTOFORGE_PIN: "test-pin-not-real"
          CRYPTOFORGE_TOTP_SECRET: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          DISCORD_WEBHOOK_URL: ""
          CRYPTOFORGE_STATE_DIR: "/tmp/cryptoforge-ci-state"
        run: |
          pytest tests/ -v --tb=short

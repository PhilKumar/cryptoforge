# Builds the buyer's double-clickable Cascade app for macOS and Windows.
#
# Two runners because PyInstaller cannot cross-compile: a .app can only be made
# on a Mac and a .exe only on Windows. Triggered by a tag rather than by every
# push — a build a buyer might install should correspond to something named.
#
# SIGNING IS OPTIONAL HERE AND THAT IS DELIBERATE, FOR NOW. Without the
# secrets below the artefacts still build and still run, but macOS says "the
# developer cannot be verified" and Windows shows a SmartScreen warning — which
# is a poor thing to meet thirty seconds before typing an exchange API key into
# something. The steps are wired and skip themselves until the certificates
# exist, so turning it on is adding secrets rather than editing this file:
#
#   macOS    MACOS_CERT_P12 (base64), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (for notarisation)
#   Windows  WINDOWS_CERT_PFX (base64), WINDOWS_CERT_PASSWORD

name: Release executor

on:
  push:
    tags: ["executor-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    # Lifted to env because the `secrets` context is not available in a step
    # `if:` — Actions rejects the workflow with "Unrecognized named-value:
    # 'secrets'". `env` is available there, so the skip-until-signed behaviour
    # has to be expressed this way round.
    env:
      HAVE_MAC_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what the app needs and what builds it
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r executor/requirements.txt pyinstaller

      # The executor's own tests, on the machine that is about to package it.
      # A build that ships is a build whose tests ran here, not only on Linux.
      - name: Test
        env:
          CASCADE_NO_KEYRING: "1" # never reach into the runner's login keychain
        run: python -m pytest tests/test_executor_*.py -q

      - name: Icons
        run: python -m installer.make_icons build/icons

      - name: Build
        run: pyinstaller installer/cascade.spec --noconfirm --distpath build/dist --workpath build/work

      - name: Sign
        if: env.HAVE_MAC_CERT == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p builder build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p builder build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k builder build.keychain
          rm -f /tmp/cert.p12
          # --options runtime is required for notarisation; the entitlement
          # lets a PyInstaller build load its own unsigned-at-link-time libs.
          codesign --deep --force --options runtime --timestamp \
            --sign "$IDENTITY" build/dist/Cascade.app
          codesign --verify --deep --strict --verbose=2 build/dist/Cascade.app

      - name: Package as a disk image
        run: |
          mkdir -p build/dmg && cp -R build/dist/Cascade.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Cascade -srcfolder build/dmg -ov -format UDZO build/Cascade-macOS.dmg

      - name: Notarise
        if: env.HAVE_APPLE_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit build/Cascade-macOS.dmg \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          # Stapling is what makes it open with no network, on a machine that
          # has never seen it before — which is every buyer's machine.
          xcrun stapler staple build/Cascade-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Cascade-macOS
          path: build/Cascade-macOS.dmg

  windows:
    runs-on: windows-latest
    env:
      HAVE_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what the app needs and what builds it
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r executor/requirements.txt pyinstaller

      - name: Test
        env:
          CASCADE_NO_KEYRING: "1"
        run: python -m pytest tests/test_executor_*.py -q

      - name: Icons
        run: python -m installer.make_icons build/icons

      - name: Build
        run: pyinstaller installer/cascade.spec --noconfirm --distpath build/dist --workpath build/work

      - name: Sign
        if: env.HAVE_WIN_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT))
          & signtool sign /f "$env:TEMP\cert.pfx" /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            build\dist\Cascade\Cascade.exe
          Remove-Item "$env:TEMP\cert.pfx"

      - name: Package as a zip
        shell: pwsh
        run: Compress-Archive -Path build\dist\Cascade\* -DestinationPath build\Cascade-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cascade-Windows
          path: build/Cascade-Windows.zip

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true # a human decides when buyers can see it
          body: |
            The buyer's Cascade app. Download, open, and follow the setup page.

            Not yet code-signed unless the release notes say otherwise — macOS
            will warn that the developer cannot be verified.

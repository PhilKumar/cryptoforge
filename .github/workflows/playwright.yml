name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-cryptoforge:
    name: E2E — CryptoForge
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ── Python (for the FastAPI dev server) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      # ── Node.js (for Playwright) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright deps
        working-directory: e2e-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Audit the seven e2e packages, but tell a VULNERABILITY apart from an
      # UNREACHABLE REGISTRY. Both exit 1, and while they sat in the install
      # step above, npm's audit service going down took the whole gate with
      # it: 2026-09-04, three runs in a row died here with "audit endpoint
      # returned an error", zero tests executed, and the failure on GitHub
      # read exactly like a real test failure. npm posted no incident, and
      # the endpoint hung — seven minutes per attempt — rather than refusing,
      # so the step was also slower than the suite it was blocking.
      #
      # A high-severity finding still fails the job. A registry that cannot
      # answer is a warning, because the security of these packages did not
      # change when npm's uptime did.
      - name: Audit npm deps
        working-directory: e2e-tests
        run: |
          set +e
          # --fetch-timeout is npm's own ceiling; `timeout` is the backstop for
          # a request that hangs below it. Guarded by command -v so a runner
          # image without coreutils cannot turn a missing tool into "127" and
          # have the branch below read it as a vulnerability — which is the
          # very confusion this step exists to end.
          if command -v timeout >/dev/null 2>&1; then
            out="$(timeout 120 npm audit --audit-level=high --fetch-timeout=60000 2>&1)"
          else
            out="$(npm audit --audit-level=high --fetch-timeout=60000 2>&1)"
          fi
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # 124 = killed by timeout, 127 = npm or timeout missing. Neither says
          # anything about the packages.
          if [ "$status" -eq 124 ] || [ "$status" -eq 127 ] || printf '%s' "$out" | grep -qiE \
            'audit endpoint returned an error|Service Unavailable|ENOTFOUND|EAI_AGAIN|ETIMEDOUT|ECONNRESET|socket hang up|network'; then
            echo "::warning title=npm audit unavailable::The registry could not be reached, so the packages were not audited. Not treated as a vulnerability."
            exit 0
          fi
          echo "::error title=npm audit::High-severity vulnerabilities reported."
          exit "$status"

      # ── Start CryptoForge server ──
      - name: Start CryptoForge dev server
        env:
          CRYPTOFORGE_PIN: "123456"
          DELTA_API_KEY: "e2e-dummy"
          DELTA_API_SECRET: "e2e-dummy-secret"
          BINANCE_API_KEY: ""
          BINANCE_API_SECRET: ""
          COINDCX_API_KEY: ""
          COINDCX_API_SECRET: ""
          CRYPTOFORGE_TOTP_SECRET: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          DISCORD_WEBHOOK_URL: ""
          CRYPTOFORGE_STATE_DIR: "/tmp/cryptoforge-e2e-state"
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8001 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8001/api/health > /dev/null || (echo "Server failed to start" && exit 1)
          echo "CryptoForge is up on :8001"

      # ── Run Playwright tests ──
      - name: Run Playwright tests
        env:
          E2E_PIN: "123456"
          E2E_USER: "admin"
        working-directory: e2e-tests
        run: npx playwright test --project=cryptoforge

      # ── Upload artifacts on failure ──
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cryptoforge
          path: |
            e2e-tests/playwright-report/
            e2e-tests/test-results/
          retention-days: 14

  # ── Deploy (only on push to main, gated on E2E passing) ──────
  deploy-cryptoforge:
    name: Deploy — CryptoForge
    needs: [e2e-cryptoforge]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-cryptoforge
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      # cd-deploy.sh exits 75 when it refuses to restart the service because
      # real trading is in flight. That is the gate working, not a broken
      # build, so it must not paint a green test run red — a red mark that
      # means "everything is fine" is worse than no mark at all.
      - name: Run zero-downtime deploy
        id: deploy
        run: |
          set +e
          ssh deploy-target "cd ~/cryptoforge && git fetch origin main && git reset --hard origin/main && bash deploy/cd-deploy.sh"
          status=$?
          set -e
          if [[ "$status" -eq 75 ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped — trading was in flight" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Open positions or resting orders on the active port, so the service was" >> "$GITHUB_STEP_SUMMARY"
            echo "left running untouched. The new code IS checked out on the box, and the" >> "$GITHUB_STEP_SUMMARY"
            echo "front end is served from disk — so HTML/JS changes are already live and" >> "$GITHUB_STEP_SUMMARY"
            echo "only the Python process is still on the old build." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run this job once the book is flat to finish the deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Deploy skipped::Trading in flight — service untouched, re-run when flat"
            exit 0
          fi
          exit "$status"

      - name: Verify deployment
        if: steps.deploy.outputs.skipped != 'true'
        run: |
          sleep 3
          ssh deploy-target "cd ~/cryptoforge && test \"\$(git rev-parse HEAD)\" = \"${GITHUB_SHA}\" && curl -sf http://127.0.0.1:\$(cat ~/.cryptoforge-active-port)/api/health >/dev/null && echo 'Deployment commit and health verified'"

      - name: Post-deploy summary
        if: always()
        run: |
          ssh deploy-target "echo '── CryptoForge Deploy Status ──' && systemctl is-active cryptoforge@\$(cat ~/.cryptoforge-active-port) && echo 'Active port:' \$(cat ~/.cryptoforge-active-port)"

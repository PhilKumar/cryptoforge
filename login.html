<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07090f">
<meta name="application-name" content="CryptoForge">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260616-1">
<link rel="manifest" href="/manifest.webmanifest?v=20260616-1">
<title>CryptoForge — Unlock</title>
<script src="/static/cryptoforge-boot.js?v=20260616-1"></script>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/cryptoforge-login.css?v=20260616-1">
<link rel="stylesheet" href="/static/cryptoforge-pwa.css?v=20260616-1">

</head>
<body>

<!-- The unlock screen sits on the landing hero, blurred — the same front door,
     out of focus, rather than a second unrelated dark page. It follows whatever
     the landing's hero actually is: that used to be a Dojima plate and is now
     the poster frame of the hero film. If the landing hero changes again, this
     src moves with it, and tests/test_live_hardening.py fails if the file it
     names has gone. -->
<div class="unlock-backdrop" aria-hidden="true">
  <img src="/static/landing/film/clips/00_plate_poster.jpg" alt="">
</div>

<button type="button" class="login-appearance-toggle" id="login-appearance-toggle" aria-label="Appearance">
  <span class="login-appearance-dot"></span>
  <span>Style</span>
</button>
<div class="login-appearance-panel" id="login-appearance-panel" hidden>
  <div class="login-appearance-title">Appearance</div>
  <div class="login-appearance-label">Theme</div>
  <div class="login-theme-row">
    <button type="button" data-login-theme="dark">Dark</button>
    <button type="button" data-login-theme="light">Light</button>
  </div>
  <div class="login-appearance-label">Tint</div>
  <div class="login-appearance-grid">
    <button type="button" data-login-tint="arctic" class="swatch-arctic" aria-label="Arctic tint"></button>
    <button type="button" data-login-tint="gold" class="swatch-gold" aria-label="Gold tint"></button>
    <button type="button" data-login-tint="magenta" class="swatch-magenta" aria-label="Magenta tint"></button>
    <button type="button" data-login-tint="citrus" class="swatch-citrus" aria-label="Citrus tint"></button>
    <button type="button" data-login-tint="graphite" class="swatch-graphite" aria-label="Graphite tint"></button>
    <button type="button" data-login-tint="bronze" class="swatch-bronze" aria-label="Bronze tint"></button>
  </div>
  <div class="login-appearance-label">Font</div>
  <!-- The app's six presets, by their app names. This list used to offer
       terminal/modern/quant — names boot.js's allowlist has never accepted,
       so three of five buttons silently applied Institutional. If a preset
       is ever added it goes in boot.js first, here second. -->
  <div class="login-font-list">
    <button type="button" data-login-font="institutional">Institutional</button>
    <button type="button" data-login-font="swiss">Swiss</button>
    <button type="button" data-login-font="grotesk">Grotesk</button>
    <button type="button" data-login-font="editorial">Editorial</button>
    <button type="button" data-login-font="techno">Techno</button>
    <button type="button" data-login-font="humanist">Humanist</button>
  </div>
</div>

<main class="unlock-card" id="unlock-card" aria-labelledby="unlock-title">
  <!-- The terminal's own mark — three depth columns and a spark — not a "CF"
       monogram the rest of the product never uses. Same geometry as
       .topbar-brand-icon in the app and the executor's console. -->
  <div class="brand-icon" aria-hidden="true">
    <span class="brand-column col-a"></span>
    <span class="brand-column col-b"></span>
    <span class="brand-column col-c"></span>
    <span class="brand-spark"></span>
  </div>
  <h1 class="unlock-title" id="unlock-title">CryptoForge</h1>
  <div class="unlock-sub" id="unlock-sub">Sign in to continue</div>

  <!-- Accounts, since 2026-08-17: username + password, then the account's
       authenticator code if it has one (the server answers 428 and the code
       field appears), or a passkey. The same door as PhilForge's, in this
       desk's colours. -->
  <div class="auth-field">
    <label class="sr-only" for="username-input">Username</label>
    <input type="text" id="username-input" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="unlock-status" autofocus>
  </div>

  <div class="auth-field" id="password-field">
    <div class="secret-wrap">
      <label class="sr-only" for="password-input">Password</label>
      <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" aria-describedby="unlock-status">
      <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">Show</button>
    </div>
  </div>

  <div class="auth-field hidden" id="totp-field">
    <label class="sr-only" for="totp-input">Authenticator code</label>
    <input type="text" id="totp-input" placeholder="6-digit authenticator code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6">
  </div>

  <div class="unlock-status" id="unlock-status" role="status" aria-live="polite" aria-atomic="true">Enter username &amp; password</div>

  <div class="unlock-actions">
    <button type="button" class="unlock-btn" id="unlock-btn">Unlock</button>
    <!-- Hidden until the browser confirms it has a platform authenticator, so
         nobody is offered a fingerprint button on a machine that has none. -->
    <button type="button" class="unlock-btn unlock-btn--passkey" id="passkey-btn" hidden>Use Face ID or fingerprint</button>
  </div>

  <div class="unlock-footer">Password + authenticator when enabled &middot; Auto-locks after 24h</div>
</main>

<script src="/static/cryptoforge-login.js?v=20260616-1" defer></script>
<script src="/static/pwa.js?v=20260616-1" defer></script>

</body>
</html>
